name: PharmaOpt validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Validate saved dashboard data
        run: python scripts/validate_pharmaopt_data.py
      - name: Validate model timing safeguards
        run: python scripts/validate_model_audit.py
